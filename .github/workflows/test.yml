name: Smart Dynamic Tests

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Add repo root to PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Get changed Python files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            pyfiles:
              - '**/*.py'

      - name: Restore tests from base branch and run matching tests
        if: steps.changes.outputs.pyfiles == 'true'
        run: |
          echo "PR base branch: ${{ github.base_ref }}"

          git fetch origin ${{ github.base_ref }}

          CHANGED_FILES=$(git diff --name-only \
            origin/${{ github.base_ref }}...HEAD \
            | grep '\.py$' || true)

          echo "Changed Python files:"
          echo "$CHANGED_FILES"

          # Replace tests directory with tests from base branch
          rm -rf tests

          git checkout origin/${{ github.base_ref }} -- tests

          TESTS_RUN=false

          for file in $CHANGED_FILES
          do
            # Ignore test files changed in PR
            if [[ $file == tests/* ]]; then
              continue
            fi

            filename=$(basename "$file" .py)
            testfile="tests/test_${filename}.py"

            if [ -f "$testfile" ]; then
              echo "Running $testfile"
              python -m pytest "$testfile" -v
              TESTS_RUN=true
            else
              echo "No test found for $file"
            fi
          done

          if [ "$TESTS_RUN" = false ]; then
            echo "No matching tests found."
            exit 0
          fi

      - name: Fallback full test run
        if: steps.changes.outputs.pyfiles == 'false'
        run: |
          git fetch origin ${{ github.base_ref }}
          rm -rf tests
          git checkout origin/${{ github.base_ref }} -- tests

          python -m pytest -v
